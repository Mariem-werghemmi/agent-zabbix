# =====================================================================
# CI DevSecOps -- secrets, SAST, SCA, tests, build, scan d'image.
# Le pipeline ECHOUE (bloque le merge) si un secret est trouve ou si une
# vulnerabilite CRITICAL/HIGH corrigeable est detectee.
# =====================================================================
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet pour Gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- 1. SECRETS : Gitleaks (echoue si un secret est trouve) --------
      - name: Gitleaks (detection de secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances + outils de test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock bandit pip-audit

      # --- 2. SAST : Bandit (analyse statique du code Python) ------------
      - name: Bandit (SAST)
        run: bandit -r core cli.py web.py config.py evaluate.py -ll

      # --- 3. SCA : pip-audit (CVE des dependances Python) --------------
      - name: pip-audit (dependances)
        run: pip-audit -r requirements.txt

      # --- 4. TESTS unitaires (garde-fous + resistance injection) --------
      - name: Tests (pytest)
        run: pytest -q

      # --- 5. BUILD des images Docker -----------------------------------
      - name: Build image agent
        run: docker build -f docker/Dockerfile.agent -t agent-zabbix-agent:ci .




      - name: Build image web
        run: docker build -f docker/Dockerfile.web -t agent-zabbix-web:ci .

      # --- 6. SCAN d'image : Trivy (echoue sur CRITICAL/HIGH corrigeable)-
      - name: Trivy (scan de l'image agent)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: agent-zabbix-agent:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy (scan de l'image web)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: agent-zabbix-web:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
